<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink Java Editor</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <div id="main-container">
      <!-- 活动栏 -->
      <div id="activity-bar">
        <button class="activity-btn active" id="btn-explorer" title="资源管理器">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button class="activity-btn" id="btn-git" title="源代码管理（Git）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
            <path d="M18 9a9 9 0 0 1-9 9"/>
          </svg>
        </button>
        <button class="activity-btn active" id="btn-outline" title="大纲">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
        <div class="activity-spacer"></div>
        <button class="activity-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <!-- 侧边栏：资源管理器视图 与 Git 视图互斥切换 -->
      <div id="sidebar">
        <div class="panel-header" id="project-name">资源管理器</div>
        <div id="explorer-view">
          <div id="file-tree-container">
            <div id="file-tree"></div>
          </div>
          <div id="outline-container">
            <div class="panel-header">大纲</div>
            <div id="outline-panel"></div>
          </div>
        </div>
        <div id="git-container">
          <div class="panel-header git-header">
            <span>Git</span>
            <span id="git-branch" class="git-branch-badge" hidden></span>
            <span class="git-header-spacer"></span>
            <button class="git-icon-btn" id="btn-git-refresh" title="刷新 Git 状态">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
              </svg>
            </button>
          </div>
          <div id="git-panel"></div>
        </div>
      </div>
      <div id="resizer"></div>
      <!-- 编辑区 -->
      <div id="editor-container">
        <div id="editor-header">
          <div id="tab-bar"></div>
          <div id="editor-actions">
            <!-- Markdown 模式切换：纯编辑 / 双栏 / 纯预览（Ctrl+Shift+V 循环切换） -->
            <div id="md-mode-switch" class="mode-switch" hidden>
              <button class="mode-btn active" id="btn-mode-edit" title="纯编辑">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
              </button>
              <button class="mode-btn" id="btn-mode-split" title="双栏编辑（编辑 + 预览，滚动同步）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>
                </svg>
              </button>
              <button class="mode-btn" id="btn-mode-preview" title="纯预览">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="editor-area">
          <div id="editor"></div>
          <div id="markdown-preview" hidden>
            <div class="panel-header">预览</div>
            <div id="markdown-preview-content" class="markdown-body"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 状态栏 -->
    <div id="status-bar">
      <div id="status-left"><span id="status-breadcrumb"></span><span class="status-item" id="status-git" hidden></span></div>
      <div id="status-right">
        <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
        <span class="status-item" id="status-lines"></span>
        <span class="status-item" id="status-encoding">UTF-8</span>
        <span class="status-item">Ink Java Editor</span>
      </div>
    </div>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
