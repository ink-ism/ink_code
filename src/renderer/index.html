<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkCode</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app">
    <!-- 自绘标题栏：左侧应用标识 + 菜单栏，右上角为原生窗口按钮 overlay -->
    <div id="title-bar">
      <div id="tb-app"><span class="tb-logo"></span><span class="tb-title">InkCode</span></div>
      <div id="tb-menubar"></div>
      <!-- 编译运行：执行配置的 bat/ps1 脚本（靠右，窗口按钮 overlay 左侧） -->
      <div id="tb-task-actions">
        <div id="task-actions-group" class="mode-switch">
          <button class="mode-btn" id="btn-task-build" title="编译（Ctrl+Shift+B）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </button>
          <button class="mode-btn" id="btn-task-run" title="运行（F5）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="6 3 20 12 6 21 6 3"/>
            </svg>
          </button>
          <button class="mode-btn" id="btn-task-build-run" title="编译并运行（Ctrl+F5）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 13 12 5 21 5 3"/>
              <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="main-container">
      <!-- 活动栏 -->
      <div id="activity-bar">
        <button class="activity-btn active" id="btn-explorer" title="资源管理器">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button class="activity-btn" id="btn-git" title="源代码管理（Git）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
            <path d="M18 9a9 9 0 0 1-9 9"/>
          </svg>
        </button>
        <button class="activity-btn active" id="btn-outline" title="大纲">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
        <button class="activity-btn" id="btn-references" title="引用">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="7" r="3"/><path d="M9 10v4"/>
            <circle cx="17" cy="7" r="2"/><path d="M17 9v3"/>
            <circle cx="5" cy="17" r="2"/><path d="M5 19v1"/>
            <path d="M12 17h4"/><path d="M9 14l-2 3"/>
          </svg>
        </button>
        <div class="activity-spacer"></div>
        <button class="activity-btn" id="btn-task-output" title="输出面板（编译/运行）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button class="activity-btn" id="btn-terminal" title="终端（Ctrl+`）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </button>
        <button class="activity-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <!-- 主内容区：侧边栏 + 编辑区 + 引用面板（终端横跨本区域底部，不含活动栏） -->
      <div id="main-area">
      <div id="main-area-row">
      <!-- 侧边栏：资源管理器视图 与 Git 视图互斥切换 -->
      <div id="sidebar">
        <div class="panel-header" id="project-name">资源管理器</div>
        <div id="explorer-view">
          <div id="file-tree-container">
            <div id="file-tree"></div>
          </div>
          <div id="outline-container">
            <div class="panel-header">大纲</div>
            <div id="outline-panel"></div>
          </div>
        </div>
        <div id="git-container">
          <div class="panel-header git-header">
            <span>Git</span>
            <span id="git-branch" class="git-branch-badge" hidden></span>
            <span class="git-header-spacer"></span>
            <button class="git-icon-btn" id="btn-git-refresh" title="刷新 Git 状态">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
              </svg>
            </button>
          </div>
          <div id="git-panel"></div>
        </div>
      </div>
      <div id="resizer"></div>
      <!-- 编辑区 -->
      <div id="editor-container">
        <div id="editor-header">
          <div id="tab-bar"></div>
          <div id="editor-actions">
            <!-- Markdown 模式切换：纯编辑 / 双栏 / 纯预览（Ctrl+Shift+V 循环切换） -->
            <div id="md-mode-switch" class="mode-switch" hidden>
              <button class="mode-btn active" id="btn-mode-edit" title="纯编辑">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
              </button>
              <button class="mode-btn" id="btn-mode-split" title="双栏编辑（编辑 + 预览，滚动同步）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>
                </svg>
              </button>
              <button class="mode-btn" id="btn-mode-preview" title="纯预览">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="editor-area">
          <div id="editor"></div>
          <div id="markdown-preview" hidden>
            <div class="panel-header">预览</div>
            <div id="markdown-preview-content" class="markdown-body"></div>
          </div>
        </div>
      </div>
      <!-- 引用查找结果面板（右侧栏，分隔条可拖拽调宽） -->
      <div id="references-resizer" hidden></div>
      <div id="references-panel" hidden></div>
      </div>
      <!-- 任务输出面板（主内容区底部，与终端面板互斥） -->
      <div id="task-resizer" hidden></div>
      <div id="task-panel" hidden></div>
      <!-- 终端面板（主内容区底部，横跨侧边栏与编辑区，可拖拽调整高度） -->
      <div id="terminal-resizer" hidden></div>
      <div id="terminal-panel" hidden>
        <div id="terminal-header">
          <span id="terminal-title">终端</span>
          <div id="terminal-actions">
            <button id="btn-terminal-new" class="terminal-btn" title="新建终端">+</button>
            <button id="btn-terminal-close" class="terminal-btn" title="关闭终端面板">✕</button>
          </div>
        </div>
        <div id="terminal-tabs"></div>
        <div id="terminal-content"></div>
      </div>
      </div>
    </div>
    <!-- 状态栏 -->
    <div id="status-bar">
      <div id="status-left"><span id="status-breadcrumb"></span><span class="status-item" id="status-git" hidden></span></div>
      <div id="status-right">
        <span class="status-item" id="status-cursor">Ln 1, Col 1</span>
        <span class="status-item" id="status-lines"></span>
        <span class="status-item" id="status-encoding">UTF-8</span>
        <span class="status-item">InkCode</span>
      </div>
    </div>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
